<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 초간단 32문항 MBTI 테스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    </style>
</head>
<body class="flex flex-col items-center min-h-screen p-4">

    <div id="start-screen" class="max-w-md w-full mt-20 text-center animate__animated animate__fadeIn">
        <h1 class="text-4xl font-extrabold mb-6 text-indigo-600">🧠 MBTI 32 퀴즈</h1>
        <p class="text-gray-600 mb-8">딱 32문제로 알아보는 나의 진짜 성격!<br>지금 바로 시작해보세요.</p>
        <button onclick="startQuiz()" class="w-full py-4 gradient-bg text-white rounded-2xl font-bold text-xl shadow-lg hover:opacity-90 transition">시작하기 🚀</button>
    </div>

    <div id="quiz-screen" class="max-w-md w-full mt-10 hidden">
        <div class="mb-4">
            <div class="flex justify-between mb-2 text-sm font-medium text-indigo-600">
                <span id="progress-text">1 / 32</span>
                <span id="percent-text">0%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2.5">
                <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <div id="question-card" class="bg-white p-8 rounded-3xl shadow-xl min-h-[300px] flex flex-col justify-center animate__animated animate__fadeInRight">
            <h2 id="question-text" class="text-2xl font-bold text-gray-800 mb-8 leading-tight text-center">질문이 여기에 표시됩니다.</h2>
            <div class="space-y-4">
                <button onclick="selectOption('A')" id="btn-a" class="w-full py-4 px-6 border-2 border-indigo-100 rounded-xl hover:bg-indigo-50 hover:border-indigo-300 transition text-left font-medium text-gray-700"></button>
                <button onclick="selectOption('B')" id="btn-b" class="w-full py-4 px-6 border-2 border-indigo-100 rounded-xl hover:bg-indigo-50 hover:border-indigo-300 transition text-left font-medium text-gray-700"></button>
            </div>
        </div>
    </div>

    <div id="result-screen" class="max-w-md w-full mt-10 hidden text-center animate__animated animate__zoomIn">
        <div class="bg-white p-10 rounded-3xl shadow-2xl border-t-8 border-indigo-500">
            <h3 class="text-xl font-bold text-gray-500 mb-2">당신의 결과는?</h3>
            <div id="result-mbti" class="text-6xl font-black text-indigo-600 mb-4 tracking-widest"></div>
            <div id="result-emoji" class="text-7xl mb-6"></div>
            <p id="result-desc" class="text-gray-700 leading-relaxed mb-8 whitespace-pre-line"></p>
            <button onclick="location.reload()" class="w-full py-3 bg-gray-100 text-gray-600 rounded-xl font-bold hover:bg-gray-200 transition">다시 하기 🔄</button>
        </div>
    </div>

    <script>
        const questions = [
            // E vs I (8문항)
            { q: "주말에 나는?", a: "사람들과 어울리며 에너지를 얻는다", b: "집에서 혼자 쉬며 재충전한다", type: "EI" },
            { q: "새로운 모임에 가면?", a: "먼저 말을 걸며 분위기를 주도한다", b: "상대방이 말을 걸어줄 때까지 기다린다", type: "EI" },
            // ... (중략 - 로직 테스트를 위해 8세트 반복 구조)
            { q: "슬픔을 나누면?", a: "슬픔이 반이 된다", b: "슬퍼하는 사람이 둘이 된다", type: "TF" },
            { q: "여행 계획을 세울 때?", a: "분 단위로 꼼꼼하게 짠다", b: "목적지만 정하고 발길 닿는 대로 간다", type: "JP" }
            // 실제 데이터는 32개를 넣으면 됩니다. (아래 스크립트에서 자동 생성 예시)
        ];

        // 32개 문항 자동 생성 (EI, SN, TF, JP 각각 8개씩)
        const types = ["EI", "SN", "TF", "JP"];
        const fullQuestions = [];
        for(let i=0; i<32; i++) {
            const type = types[i % 4];
            fullQuestions.push({
                q: `[${type}] 질문 ${Math.floor(i/4)+1}: 당신의 선택은?`,
                a: `${type} 성향 A 선택지입니다.`,
                b: `${type} 성향 B 선택지입니다.`,
                type: type
            });
        }

        let currentIdx = 0;
        let scores = { EI: 0, SN: 0, TF: 0, JP: 0 };

        function startQuiz() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const q = fullQuestions[currentIdx];
            document.getElementById('question-text').innerText = q.q;
            document.getElementById('btn-a').innerText = q.a;
            document.getElementById('btn-b').innerText = q.b;
            
            // 프로그레스 업데이트
            const progress = ((currentIdx) / 32) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('progress-text').innerText = `${currentIdx + 1} / 32`;
            document.getElementById('percent-text').innerText = `${Math.round(progress)}%`;
        }

        function selectOption(choice) {
            const type = fullQuestions[currentIdx].type;
            if (choice === 'A') scores[type]++;
            
            currentIdx++;
            if (currentIdx < 32) {
                const card = document.getElementById('question-card');
                card.classList.remove('animate__fadeInRight');
                void card.offsetWidth; // reflow
                card.classList.add('animate__fadeInRight');
                showQuestion();
            } else {
                showResult();
            }
        }

        const resultData = {
            "ENFJ": { emoji: "🔥", desc: "정의로운 사회운동가!\n타인의 성장을 돕고 협력하는 것을 좋아해요." },
            "ISTP": { emoji: "🛠️", desc: "만능 재주꾼!\n냉철한 이성과 왕성한 호기심을 가졌어요." },
            // 필요한 모든 MBTI 결과를 여기에 추가
        };

        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden');
            const res = document.getElementById('result-screen');
            res.classList.remove('hidden');

            let mbti = "";
            mbti += scores.EI >= 4 ? "E" : "I";
            mbti += scores.SN >= 4 ? "S" : "N";
            mbti += scores.TF >= 4 ? "T" : "F";
            mbti += scores.JP >= 4 ? "J" : "P";

            document.getElementById('result-mbti').innerText = mbti;
            const data = resultData[mbti] || { emoji: "✨", desc: "당신은 정말 특별한 사람군요!\n어떤 틀에도 가둘 수 없는 매력을 가졌습니다." };
            document.getElementById('result-emoji').innerText = data.emoji;
            document.getElementById('result-desc').innerText = data.desc;
        }
    </script>
</body>
</html>
