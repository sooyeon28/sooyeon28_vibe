<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심심풀이 MBTI 테스트</title>
    <style>
        :root {
            --primary-color: #6c5ce7;
            --bg-color: #f9f9fb;
            --text-color: #2d3436;
        }
        body { font-family: 'Pretendard', sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 500px; text-align: center; }
        h1 { color: var(--primary-color); margin-bottom: 1rem; }
        .progress-bar { width: 100%; height: 10px; background: #eee; border-radius: 5px; margin-bottom: 2rem; overflow: hidden; }
        .progress { width: 0%; height: 100%; background: var(--primary-color); transition: 0.3s; }
        .question-box { display: none; }
        .active { display: block; }
        .btn-wrap { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        button { padding: 15px; border: none; border-radius: 12px; background: #a29bfe; color: white; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        button:hover { background: var(--primary-color); transform: translateY(-2px); }
        .result-emoji { font-size: 5rem; margin: 1rem 0; }
        .result-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .result-table th, .result-table td { border: 1px solid #eee; padding: 10px; font-size: 0.9rem; }
        .result-table th { background: #f4f4f4; }
        .restart-btn { margin-top: 20px; background: #ff7675; }
    </style>
</head>
<body>

<div class="container">
    <div id="start-screen" class="active">
        <h1>✨ 초간단 MBTI 테스트</h1>
        <p>32개의 질문으로 알아보는 나의 성격!<br>나는 어떤 캐릭터일까요?</p>
        <button onclick="startTest()">테스트 시작하기</button>
    </div>

    <div id="question-screen" class="question-box">
        <div class="progress-bar"><div class="progress" id="progress"></div></div>
        <h2 id="question-text">질문 내용</h2>
        <div class="btn-wrap">
            <button onclick="nextQuestion(1)">매우 그렇다</button>
            <button onclick="nextQuestion(0)">전혀 아니다</button>
        </div>
    </div>

    <div id="result-screen" class="question-box">
        <h2>당신의 결과는?</h2>
        <div id="result-char" class="result-emoji"></div>
        <h1 id="result-mbti"></h1>
        <p id="result-desc" style="font-weight: bold;"></p>
        
        <table class="result-table">
            <tr><th>👍 장점</th><th>👎 단점</th></tr>
            <tr><td id="result-pros"></td><td id="result-cons"></td></tr>
        </table>
        
        <button class="restart-btn" onclick="location.reload()">다시 하기</button>
    </div>
</div>

<script>
    const questions = [
        // E(외향) vs I(내향) - 8문항
        { q: "처음 보는 사람에게 말을 거는 것이 어렵지 않다.", type: "E" },
        { q: "주말에는 집에 있는 것보다 나가 노는 게 좋다.", type: "E" },
        { q: "여러 명과 대화할 때 에너지가 충전된다.", type: "E" },
        // ... (중략: 32개를 채우기 위한 로직 구성)
        { q: "생각을 말로 표현하는 것이 글보다 편하다.", type: "E" },
        { q: "주목받는 것을 은근히 즐기는 편이다.", type: "E" },
        { q: "새로운 모임에 나가는 것이 설렌다.", type: "E" },
        { q: "침묵이 흐르는 상황을 견디기 힘들다.", type: "E" },
        { q: "활동적인 취미 활동을 선호한다.", type: "E" },
        
        // S(현실) vs N(직관) - 8문항
        { q: "실제로 일어난 일을 근거로 판단하는 편이다.", type: "S" },
        { q: "설명서를 읽을 때 꼼꼼하게 읽는 편이다.", type: "S" },
        { q: "공상보다는 눈앞의 현실이 더 중요하다.", type: "S" },
        { q: "전통적인 방식이나 검증된 방법을 선호한다.", type: "S" },
        { q: "비유적인 표현보다 직설적인 표현이 좋다.", type: "S" },
        { q: "세부 사항을 기억하는 능력이 좋다.", type: "S" },
        { q: "반복되는 일상에 안정감을 느낀다.", type: "S" },
        { q: "모호한 지시보다는 정확한 가이드라인이 좋다.", type: "S" },

        // T(이성) vs F(감정) - 8문항
        { q: "친구의 고민을 들으면 해결책부터 생각난다.", type: "T" },
        { q: "감정보다는 논리적 근거가 더 중요하다.", type: "T" },
        { q: "비판을 들었을 때 감정보다 내용에 집중한다.", type: "T" },
        { q: "공정함이 친절함보다 우선되어야 한다고 본다.", type: "T" },
        { q: "효율성을 따지는 것이 습관화되어 있다.", type: "T" },
        { q: "단호하게 거절하는 것이 어렵지 않다.", type: "T" },
        { q: "상황을 객관적으로 분석하는 능력이 뛰어나다.", type: "T" },
        { q: "이성적인 사람이라는 말을 자주 듣는다.", type: "T" },

        // J(계획) vs P(즉흥) - 8문항
        { q: "여행을 갈 때 시간 단위로 계획을 세운다.", type: "J" },
        { q: "주변 정돈이 잘 되어 있어야 마음이 편하다.", type: "J" },
        { q: "마감 기한은 무조건 여유 있게 지키는 편이다.", type: "J" },
        { q: "결정을 빨리 내리는 것을 선호한다.", type: "J" },
        { q: "리스트를 만들고 지워나가는 것을 좋아한다.", type: "J" },
        { q: "예상치 못한 변수가 생기면 당황스럽다.", type: "J" },
        { q: "한 가지 일을 끝내고 다음 일을 시작한다.", type: "J" },
        { q: "규칙과 체계가 있는 환경이 편하다.", type: "J" }
    ];

    const results = {
        "ISTJ": { emoji: "🍱", desc: "청렴결백한 전략가", pros: "책임감, 정확성", cons: "변화에 취약, 고집" },
        "ISFJ": { emoji: "🛡️", desc: "용감한 수호자", pros: "헌신적, 세심함", cons: "자기희생, 거절 못함" },
        "INFJ": { emoji: "🔮", desc: "선의의 옹호자", pros: "통찰력, 이타심", cons: "완벽주의, 복잡함" },
        "INTJ": { emoji: "🎓", desc: "용의주도한 전략가", pros: "전략적, 독립적", cons: "냉정함, 사회성 부족" },
        "ISTP": { emoji: "🛠️", desc: "만능 재주꾼", pros: "적응력, 분석력", cons: "개인주의, 무심함" },
        "ISFP": { emoji: "🎨", desc: "호기심 많은 예술가", pros: "포용력, 감각적", cons: "결단력 부족, 회피" },
        "INFP": { emoji: "🧚", desc: "열정적인 중재자", pros: "공감능력, 창의성", cons: "과한 잡생각, 예민" },
        "INTP": { emoji: "🧪", desc: "논리적인 사색가", pros: "아이디어, 지적호기심", cons: "게으름, 공감결여" },
        "ESTP": { emoji: "🏎️", desc: "모험을 즐기는 사업가", pros: "실행력, 활발함", cons: "충동적, 참을성 부족" },
        "ESFP": { emoji: "🎉", desc: "자유로운 영혼의 연예인", pros: "친화력, 낙천적", cons: "집중력 부족, 즉흥적" },
        "ENFP": { emoji: "🍭", desc: "재기발랄한 활동가", pros: "사교적, 열정적", cons: "뒷심 부족, 감정기복" },
        "ENTP": { emoji: "💡", desc: "뜨거운 논쟁을 즐기는 변론가", pros: "재치, 다각도 분석", cons: "반항아 기질, 무신경" },
        "ESTJ": { emoji: "📢", desc: "엄격한 관리자", pros: "추진력, 조직력", cons: "독단적, 공감부족" },
        "ESFJ": { emoji: "🤝", desc: "사교적인 외교관", pros: "협력적, 다정함", cons: "남의 시선 의식, 비판에 약함" },
        "ENFJ": { emoji: "☀️", desc: "정의로운 사회운동가", pros: "리더십, 설득력", cons: "오지랖, 감정과잉" },
        "ENTJ": { emoji: "🦁", desc: "대담한 통솔자", pros: "결단력, 카리스마", cons: "냉정함, 오만함" }
    };

    let currentIdx = 0;
    let scores = { E:0, S:0, T:0, J:0 };

    function startTest() {
        document.getElementById('start-screen').classList.remove('active');
        document.getElementById('question-screen').classList.add('active');
        showQuestion();
    }

    function showQuestion() {
        if(currentIdx < questions.length) {
            document.getElementById('question-text').innerText = questions[currentIdx].q;
            document.getElementById('progress').style.width = (currentIdx / questions.length) * 100 + "%";
        } else {
            showResult();
        }
    }

    function nextQuestion(point) {
        let type = questions[currentIdx].type;
        scores[type] += point;
        currentIdx++;
        showQuestion();
    }

    function showResult() {
        document.getElementById('question-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');

        let mbti = "";
        mbti += (scores.E >= 4) ? "E" : "I";
        mbti += (scores.S >= 4) ? "S" : "N";
        mbti += (scores.T >= 4) ? "T" : "F";
        mbti += (scores.J >= 4) ? "J" : "P";

        const res = results[mbti];
        document.getElementById('result-mbti').innerText = mbti;
        document.getElementById('result-char').innerText = res.emoji;
        document.getElementById('result-desc').innerText = res.desc;
        document.getElementById('result-pros').innerText = res.pros;
        document.getElementById('result-cons').innerText = res.cons;
    }
</script>

</body>
</html>
