<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 정밀 성격 유형 검사 (Advanced MBTI Platform)</title>
    <!-- Tailwind CSS (현대적인 UI 구성을 위한 프레임워크) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        html { scroll-behavior: smooth; }
        .bg-royal { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .progress-fill { transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- [1] 인트로 스크린 -->
    <section id="intro-screen" class="min-h-screen flex flex-col justify-center items-center p-6 bg-royal relative overflow-hidden">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(99,102,241,0.15)_0%,transparent_70%)]"></div>
        <div class="max-w-xl w-full text-center z-10 space-y-8">
            <div class="inline-flex items-center space-x-2 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-4 py-1.5 rounded-full text-sm font-semibold tracking-wide">
                <span>✨ 2026 정밀 심리 진단 엔진 v2.5</span>
            </div>
            <h1 class="text-4xl md:text-5xl font-black tracking-tight leading-tight">
                당신의 성향을 분석하는<br>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400">가장 정밀한 32문항 트래커</span>
            </h1>
            <p class="text-slate-400 text-lg max-w-md mx-auto font-light leading-relaxed">
                단순한 가십용 테스트를 넘어, 내면의 심층 지표와 강·약점 분석, 성장 솔루션까지 포괄적인 리포트를 즉시 제공합니다.
            </p>
            <div class="pt-4">
                <button onclick="startDiagnostic()" class="group relative w-full sm:w-auto inline-flex justify-center items-center space-x-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold py-4 px-12 rounded-2xl shadow-xl shadow-indigo-900/40 hover:opacity-95 transform hover:-translate-y-0.5 transition-all text-lg cursor-pointer">
                    <span>정밀 진단 시작하기</span>
                    <span class="group-hover:translate-x-1 transition-transform">→</span>
                </button>
            </div>
        </div>
    </section>

    <!-- [2] 퀴즈 메인 섹션 -->
    <main id="quiz-screen" class="hidden min-h-screen bg-slate-900 py-12 px-4 relative">
        <div class="max-w-2xl mx-auto space-y-8">
            
            <!-- 상단 스티키 프로그레스 바 -->
            <div class="sticky top-4 glass-panel p-4 rounded-2xl shadow-2xl z-50 flex items-center justify-between">
                <div class="w-full bg-slate-800 rounded-full h-3 overflow-hidden mr-4">
                    <div id="gauge-bar" class="progress-fill bg-gradient-to-r from-indigo-500 to-purple-500 h-full w-0"></div>
                </div>
                <span id="gauge-text" class="text-sm font-black text-indigo-400 min-w-[55px] text-right">0 / 32</span>
            </div>

            <!-- 동적 질문 카드 컨테이너 -->
            <div id="quiz-cards" class="space-y-6"></div>

            <!-- 리포트 생성 버튼 -->
            <div class="pt-6">
                <button id="calc-btn" onclick="buildAdvancedReport()" disabled class="w-full bg-slate-800 text-slate-500 font-bold py-4 rounded-2xl text-lg cursor-not-allowed transition-all border border-slate-700/50">
                    모든 문항에 체크하면 분석서가 오픈됩니다 🔒
                </button>
            </div>
        </div>
    </main>

    <!-- [3] 정식 심층 결과 리포트 섹션 -->
    <section id="report-screen" class="hidden min-h-screen bg-slate-950 py-16 px-4">
        <div class="max-w-4xl mx-auto space-y-8">
            
            <!-- 헤더 카드 -->
            <div class="glass-panel p-8 rounded-3xl text-center relative overflow-hidden border-indigo-500/20">
                <div class="absolute -right-16 -top-16 w-48 h-48 bg-purple-500/10 rounded-full filter blur-3xl"></div>
                <p class="text-xs font-bold tracking-widest text-indigo-400 uppercase mb-2">PERSONALITY ANALYSIS REPORT</p>
                <div id="rep-emoji" class="text-7xl mb-4">🔮</div>
                <h2 id="rep-type" class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 tracking-tighter">ENFP</h2>
                <h3 id="rep-title" class="text-2xl font-bold text-slate-100 mt-2">재기발랄한 활동가</h3>
            </div>

            <!-- 4대 지표 수치 스펙트럼 대시보드 -->
            <div class="glass-panel p-8 rounded-3xl space-y-6">
                <h4 class="text-lg font-bold text-slate-200 border-b border-slate-800 pb-3 flex items-center">
                    <span class="mr-2">📊</span> 성향별 상세 스펙트럼 데이터
                </h4>
                <div class="space-y-5" id="spectrum-dashboard">
                    <!-- JS에서 수치 바를 동적으로 계산하여 채워 넣음 -->
                </div>
            </div>

            <!-- 핵심 특징 및 장단점 심층 그리드 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 핵심 특징 -->
                <div class="glass-panel p-6 rounded-2xl border-l-4 border-indigo-500">
                    <h4 class="text-base font-bold text-indigo-400 mb-3 flex items-center">🎯 대표적인 성격 특징</h4>
                    <p id="rep-feature" class="text-slate-300 text-sm leading-relaxed whitespace-pre-line"></p>
                </div>
                <!-- 보완점 -->
                <div class="glass-panel p-6 rounded-2xl border-l-4 border-emerald-500">
                    <h4 class="text-base font-bold text-emerald-400 mb-3 flex items-center">🌱 지속적인 성장과 보완할 점</h4>
                    <p id="rep-growth" class="text-slate-300 text-sm leading-relaxed whitespace-pre-line"></p>
                </div>
                <!-- 강점 -->
                <div class="glass-panel p-6 rounded-2xl border-l-4 border-blue-500">
                    <h4 class="text-base font-bold text-blue-400 mb-3 flex items-center">👍 주요 강점 (Pros)</h4>
                    <ul id="rep-pros" class="text-slate-300 text-sm space-y-2 list-disc list-inside"></ul>
                </div>
                <!-- 약점 -->
                <div class="glass-panel p-6 rounded-2xl border-l-4 border-rose-500">
                    <h4 class="text-base font-bold text-rose-400 mb-3 flex items-center">👎 주요 약점 (Cons)</h4>
                    <ul id="rep-cons" class="text-slate-300 text-sm space-y-2 list-disc list-inside"></ul>
                </div>
            </div>

            <!-- 리셋 푸터 -->
            <div class="text-center pt-6">
                <button onclick="resetPlatform()" class="bg-slate-900 border border-slate-800 hover:bg-slate-850 text-slate-400 font-semibold py-3 px-8 rounded-xl text-sm cursor-pointer transition-all">
                    테스트 데이터 리셋 후 초기화 🔄
                </button>
            </div>
        </div>
    </section>

    <!-- 🧠 심층 진단 로직 엔진 -->
    <script>
        // 32개 정밀 질문 풀 (E/I, S/N, T/F, J/P 각 8문항 균등 배정)
        const dbQuestions = [
            { id: 1, group: "EI", text: "모르는 사람들과 섞여 있는 네트워킹 파티나 모임에 참석하면?", a: "새로운 자극을 얻어 활력이 차오른다.", b: "충분히 즐기더라도 귀가 시 기가 방전됨을 느낀다." },
            { id: 2, group: "EI", text: "의견 충돌이나 문제가 발생했을 때 내가 선호하는 소통 방식은?", a: "말을 통해 실시간으로 주거니 받거니 하며 푼다.", b: "생각을 문장으로 명확히 정리하여 비동기식(글 등)으로 전달한다." },
            { id: 3, group: "EI", text: "업무나 과제를 처리할 때 나에게 더 편안한 업무 방식은?", a: "동료들과 오픈된 공간에서 수시로 협업하고 회의하기", b: "독립적인 공간에서 방해받지 않고 홀로 집중하기" },
            { id: 4, group: "EI", text: "내 일상 속 생각이나 경험을 타인에게 개방하는 정도는?", a: "친근한 분위기라면 비교적 쉽게 오픈하고 공유한다.", b: "정말 깊게 신뢰하는 소수가 아니라면 내면을 감추는 편이다." },
            { id: 5, group: "EI", text: "주말이나 휴일, 나에게 가장 완벽한 리프레시는?", a: "맛집 투어, 취미 모임 등 외부 활동 스케줄 잡기", b: "넷플릭스, 침대, 밀린 가사 등 집 안에서의 완전한 휴식" },
            { id: 6, group: "EI", text: "회의나 토론 중 내가 주로 포지셔닝하는 위치는?", a: "선제적으로 발언을 던지며 아이디어를 빌드업하는 편", b: "맥락을 충분히 경청한 뒤 핵심적인 의견을 얹는 편" },
            { id: 7, group: "EI", text: "새로운 환경이나 낯선 커뮤니티에 진입할 때 나는?", a: "비교적 빠르게 먼저 말을 걸고 사람을 사귄다.", b: "상황과 분위기를 파악할 때까지 조용히 지켜본다." },
            { id: 8, group: "EI", text: "감정적인 스트레스가 최고조에 달했을 때 갈구하는 것은?", a: "친구들을 만나 수다를 떨거나 밖에서 활동적으로 풀기", b: "외부 자극을 차단하고 방에서 조용히 마인드컨트롤 하기" },

            { id: 9, group: "SN", text: "어떤 대상을 관찰하거나 분석할 때 나의 기본적인 초점은?", a: "눈앞에 보이는 명확한 데이터, 사실 정보, 현재 상황", b: "그 이면에 숨겨진 맥락, 가능성, 미래에 미칠 연쇄적 영향" },
            { id: 10, group: "SN", text: "새로운 프로젝트 지침서를 받았을 때 더 안도감이 드는 양식은?", a: "단계별 매뉴얼과 예시가 명확히 명시된 양식", b: "목적만 뚜렷하고 세부 실행 방식은 자율에 맡겨진 개방형 양식" },
            { id: 11, group: "SN", text: "소설이나 웰메이드 영화를 볼 때 내가 더 흥미를 느끼는 부분은?", a: "치밀하게 묘사된 현실 고증과 시각적 타격감", b: "인간 심리에 대한 은유와 다각도로 해석 가능한 열린 결말" },
            { id: 12, group: "SN", text: "어떤 문제를 해결해야 할 때 나는 보통 어떤 방식을 선택하나요?", a: "기존에 성공 사례가 검증된 효율적이고 익숙한 방식", b: "비록 리스크가 있더라도 시도해보지 않은 파격적인 방식" },
            { id: 13, group: "SN", text: "누군가 나에게 신제품 아이디어를 설명할 때 내 머릿속 반응은?", a: "제작 비용은 얼마인지, 진짜 실현 가능한 비즈니스 모델인지 계산", b: "그 제품이 바꿀 인류의 라이프스타일이나 확장성에 대한 상상" },
            { id: 14, group: "SN", text: "평소 '생각이 꼬리를 문다'고 할 때 그 생각의 결은?", a: "오늘 처리했어야 하는 일, 내일 챙겨야 할 현실적 체크리스트", b: "인간의 본질, 우주의 끝, 먼 미래의 가상 시나리오 같은 추상적 관념" },
            { id: 15, group: "SN", text: "비유나 추상적인 단어가 가득한 대화를 나눌 때 나는?", a: "핵심 요점이 뭔지 돌려 말하지 말고 직설적으로 말해줬으면 함", b: "행간을 읽는 재미가 있으며 대화가 다채롭고 즐겁게 느껴짐" },
            { id: 16, group: "SN", text: "현재 나의 삶을 관통하는 더 가치 있는 태도는?", a: "지금 발을 딛고 있는 현실에 충실하며 디테일을 챙기기", b: "원대한 미래 비전을 꿈꾸며 삶의 큰 방향성을 설계하기" },

            { id: 17, group: "TF", text: "친한 동료가 열심히 준비한 프로젝트에서 처참한 피드백을 받고 낙담해 있다면?", a: "실패 원인을 객관적으로 분석해주고 현실적 극복 대안을 제안한다.", b: "그동안 고생한 노력을 격려하고 속상한 마음에 진심으로 공감해준다." },
            { id: 18, group: "TF", text: "비즈니스나 공적인 의사결정을 내릴 때 가장 우선시되어야 하는 기준은?", a: "철저한 데이터, 규칙의 공정성, 조직적 손익 계산", b: "구성원들의 심리적 만족도, 가치관의 부합 여부, 휴머니즘" },
            { id: 19, group: "TF", text: "대화나 토론 도중 타인에게 피드백을 전달할 때 나의 스타일은?", a: "빠른 개선을 위해 왜곡 없이 핵심적인 팩트를 직설적으로 찌른다.", b: "상대방이 무안하거나 상처받지 않도록 쿠션어와 우회적 표현을 쓴다." },
            { id: 20, group: "TF", text: "나에게 '공정함(Fairness)'이란 단어가 주는 진정한 의미는?", a: "예외 없이 동일한 규칙과 기준을 엄격하게 적용하는 것", b: "개인별 처해 있는 상황과 역량을 감안하여 유연하게 배려하는 것" },
            { id: 21, group: "TF", text: "타인과 치열한 논쟁을 벌인 직후, 내 마음에 남는 앙금은?", a: "토론은 토론일 뿐, 감정 상할 이유가 전혀 없다.", b: "논리가 맞더라도 관계가 껄끄러워진 것 같아 밤새 신경 쓰인다." },
            { id: 22, group: "TF", text: "내가 상대로부터 들었을 때 영혼 깊이 감동하는 최고의 찬사는?", a: "“당신은 진짜 일 처리가 완벽하고 스마트한 전문가군요.”", b: "“당신 덕분에 무너졌던 제 마음이 치유되었고 살 힘을 얻었어요.”" },
            { id: 23, group: "TF", text: "누군가 고집스럽게 잘못된 논리로 행동하여 손해를 자초하는 것을 볼 때?", a: "냉정하게 그 행동이 틀렸음을 인과관계로 지적해준다.", b: "나름의 사정이 있겠거니 생각하며 일단 기분을 맞춰준다." },
            { id: 24, group: "TF", text: "동료의 업무 실수를 발견했을 때 머릿속에 먼저 드는 생각은?", a: "이 실수가 미칠 비즈니스적 파장과 백업 프로세스 세우기", b: "이 실수로 인해 동료가 겪을 자괴감과 패닉 상태 걱정하기" },

            { id: 25, group: "JP", text: "일주일간의 장기 해외여행을 가기 직전, 내 가방과 계획표는?", a: "일자별 동선과 필수 소지품이 엑셀이나 노트에 구조화되어 있다.", b: "꼭 필요한 여권, 지갑만 챙기고 나머지는 현지에서 유동적으로 맞춘다." },
            { id: 26, group: "JP", text: "주말 아침, 정해진 스케줄이 없을 때 나의 하루 행동 양식은?", a: "기상 후 시간대별로 할 일(청소, 독서, 운동 등)의 가이드라인을 세운다.", b: "그때그때 기분과 컨디션의 흐름에 몸을 맡기며 즉흥적으로 행동한다." },
            { id: 27, group: "JP", text: "마감 시한이 정해진 중요한 보고서나 과제를 넘겨야 할 때 나의 패턴은?", a: "매일 일정 분량을 쪼개어 마감 2~3일 전에 안정적으로 끝낸다.", b: "미루고 미루다 마감 직전 벼락치기 스퍼트로 한 번에 끝낸다." },

        const currentAnswers = {};

        // 퀴즈 기동 함수
        function startDiagnostic() {
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            buildQuestionsUI();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 32개 정밀 질문 카드 UI 렌더링
        function buildQuestionsUI() {
            const container = document.getElementById('quiz-cards');
            container.innerHTML = '';

            dbQuestions.forEach((q, idx) => {
                const card = document.createElement('div');
                card.id = `q-block-${q.id}`;
                card.className = "bg-slate-900 border border-slate-800/80 p-6 rounded-2xl shadow-xl transition-all duration-300";

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-xs font-black tracking-wider text-indigo-400 uppercase bg-indigo-950/60 border border-indigo-900 px-3 py-1 rounded-md">Diagnostic Q-${String(q.id).padStart(2, '0')}</span>
                    </div>
                    <h3 class="text-lg font-bold text-slate-100 leading-snug mb-5">${q.text}</h3>
                    <div class="grid grid-cols-1 gap-3">
                        <button id="opt-${q.id}-a" onclick="handleSelect(${q.id}, 'A', '${q.group}')" class="w-full text-left p-4 rounded-xl border border-slate-800 bg-slate-950/40 text-slate-300 hover:border-indigo-500/50 hover:bg-indigo-950/20 font-medium text-sm transition-all cursor-pointer leading-relaxed">
                            ${q.a}
                        </button>
                        <button id="opt-${q.id}-b" onclick="handleSelect(${q.id}, 'B', '${q.group}')" class="w-full text-left p-4 rounded-xl border border-slate-800 bg-slate-950/40 text-slate-300 hover:border-indigo-500/50 hover:bg-indigo-950/20 font-medium text-sm transition-all cursor-pointer leading-relaxed">
                            ${q.b}
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 특정 옵션 선택 처리 알고리즘
        function handleSelect(qId, choice, group) {
            currentAnswers[qId] = { choice, group };

            const btnA = document.getElementById(`opt-${qId}-a`);
            const btnB = document.getElementById(`opt-${qId}-b`);
            const card = document.getElementById(`q-block-${qId}`);

            // 활성화/비활성화 스타일 가이드 스위칭
            if (choice === 'A') {
                btnA.className = "w-full text-left p-4 rounded-xl border-2 border-indigo-500 bg-indigo-950/40 text-indigo-300 font-bold text-sm transition-all cursor-pointer leading-relaxed shadow-lg shadow-indigo-950/50";
                btnB.className = "w-full text-left p-4 rounded-xl border border-slate-800/50 bg-slate-950/10 text-slate-600 font-medium text-sm transition-all cursor-pointer leading-relaxed opacity-40";
            } else {
                btnB.className = "w-full text-left p-4 rounded-xl border-2 border-indigo-500 bg-indigo-950/40 text-indigo-300 font-bold text-sm transition-all cursor-pointer leading-relaxed shadow-lg shadow-indigo-950/50";
                btnA.className = "w-full text-left p-4 rounded-xl border border-slate-800/50 bg-slate-950/10 text-slate-600 font-medium text-sm transition-all cursor-pointer leading-relaxed opacity-40";
            }

            // 완료 카드 강조 피드백
            card.className = "bg-slate-900 border border-indigo-900/40 p-6 rounded-2xl shadow-2xl transition-all duration-300";

            // 상단 진행 상태 게이지 동기화
            refreshGauge();

            // 부드러운 자동 뷰포트 이동 타겟팅
            const nextBlock = document.getElementById(`q-block-${qId + 1}`);
            if (nextBlock) {
                setTimeout(() => {
                    nextBlock.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 180);
            } else {
                setTimeout(() => {
                    document.getElementById('calc-btn').scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 180);
            }
        }

        // 실시간 게이지 업데이트
        function refreshGauge() {
            const answeredTotal = Object.keys(currentAnswers).length;
            const percentage = (answeredTotal / 32) * 100;

            document.getElementById('gauge-bar').style.width = `${percentage}%`;
            document.getElementById('gauge-text').innerText = `${answeredTotal} / 32`;

            const calcBtn = document.getElementById('calc-btn');
            if (answeredTotal === 32) {
                calcBtn.disabled = false;
                calcBtn.innerText = "정밀 심층 진단 리포트 생성 완료 🔓";
                calcBtn.className = "w-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 text-slate-950 font-black py-4 rounded-2xl text-xl cursor-pointer shadow-2xl shadow-purple-900/30 hover:scale-[1.01] active:scale-[0.99] transition-all";
            }
        }

        // 결과 정밀 산출 및 다차원 대시보드 조립
        function buildAdvancedReport() {
            // 각 차원별 스코어 계산 스토리지 (각 그룹당 최대 8점)
            let scores = { EI: 0, SN: 0, TF: 0, JP: 0 };

            Object.keys(currentAnswers).forEach(id => {
                const data = currentAnswers[id];
                if (data.choice === 'A') {
                    scores[data.group]++;
                }
            });

            // 스코어링 백분율 변환 데이터 모델링
            const scoresPct = {
                E: Math.round((scores.EI / 8) * 100),
                I: 100 - Math.round((scores.EI / 8) * 100),
                S: Math.round((scores.SN / 8) * 100),
                N: 100 - Math.round((scores.SN / 8) * 100),
                T: Math.round((scores.TF / 8) * 100),
                F: 100 - Math.round((scores.TF / 8) * 100),
                J: Math.round((scores.JP / 8) * 100),
                P: 100 - Math.round((scores.JP / 8) * 100),
            };

            // 유형 확정 알고리즘
            let mbtiResult = "";
            mbtiResult += (scoresPct.E >= 50) ? "E" : "I";
            mbtiResult += (scoresPct.S >= 50) ? "S" : "N";
            mbtiResult += (scoresPct.T >= 50) ? "T" : "F";
            mbtiResult += (scoresPct.J >= 50) ? "J" : "P";

            const payload = masterDatabase[mbtiResult];

            // 리포트 텍스트 및 정보 바인딩
            document.getElementById('rep-type').innerText = mbtiResult;
            document.getElementById('rep-emoji').innerText = payload.emoji;
            document.getElementById('rep-title').innerText = payload.title;
            document.getElementById('rep-feature').innerText = payload.feature;
            document.getElementById('rep-growth').innerText = payload.growth;

            // 장단점 리스트 클리어 및 삽입
            const prosContainer = document.getElementById('rep-pros');
            const consContainer = document.getElementById('rep-cons');
            prosContainer.innerHTML = '';
            consContainer.innerHTML = '';

            payload.pros.forEach(p => { prosContainer.innerHTML += `<li>${p}</li>`; });
            payload.cons.forEach(c => { consContainer.innerHTML += `<li>${c}</li>`; });

            // 4대 성향 데이터 대시보드 게이지 드로잉
            buildSpectrumDashboard(scoresPct);

            // 스크린 교체 및 화면 복귀
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('report-screen').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 수치 스펙트럼 대시보드 컴포넌트 생성기
        function buildSpectrumDashboard(pct) {
            const dashboard = document.getElementById('spectrum-dashboard');
            
            const dimensions = [
                { leftLab: "외향성 (E)", leftVal: pct.E, rightLab: "(I) 내향성", rightVal: pct.I, color: "from-amber-500 to-orange-500" },
                { leftLab: "감각주의 (S)", leftVal: pct.S, rightLab: "(N) 직관주의", rightVal: pct.N, color: "from-emerald-500 to-teal-500" },
                { leftLab: "이성사고 (T)", leftVal: pct.T, rightLab: "(F) 감정공감", rightVal: pct.F, color: "from-blue-500 to-indigo-500" },
                { leftLab: "계획조직 (J)", leftVal: pct.J, rightLab: "(P) 자율즉흥", rightVal: pct.P, color: "from-purple-500 to-pink-500" }
            ];

            dashboard.innerHTML = '';

            dimensions.forEach(dim => {
                const row = document.createElement('div');
                row.className = "space-y-1.5";
                row.innerHTML = `
                    <div class="flex justify-between text-xs font-bold text-slate-400">
                        <span>${dim.leftLab} <span class="text-slate-200 ml-1">${dim.leftVal}%</span></span>
                        <span><span class="text-slate-200 mr-1">${dim.rightVal}%</span> ${dim.rightLab}</span>
                    </div>
                    <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden flex">
                        <div class="bg-gradient-to-r ${dim.color} h-full transition-all duration-1000" style="width: ${dim.leftVal}%"></div>
                        <div class="bg-slate-700 h-full flex-1"></div>
                    </div>
                `;
                dashboard.appendChild(row);
            });
        }

        // 플랫폼 완전히 초기화
        function resetPlatform() {
            Object.keys(currentAnswers).forEach(key => delete currentAnswers[key]);
            document.getElementById('report-screen').classList.add('hidden');
            document.getElementById('intro-screen').classList.remove('hidden');
            
            // 게이지 초기화
            document.getElementById('gauge-bar').style.width = '0%';
            document.getElementById('gauge-text').innerText = "0 / 32";

            const calcBtn = document.getElementById('calc-btn');
            calcBtn.disabled = true;
            calcBtn.innerText = "모든 문항에 체크하면 분석서가 오픈됩니다 🔒";
            calcBtn.className = "w-full bg-slate-800 text-slate-500 font-bold py-4 rounded-2xl text-lg cursor-not-allowed transition-all border border-slate-700/50";

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
